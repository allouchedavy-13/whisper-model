name: fetch-model
on: [push, workflow_dispatch]
permissions:
 contents: write
jobs:
 build:
   runs-on: ubuntu-latest
   steps:
     - uses: actions/checkout@v4
     - run: |
         mkdir -p Xenova/whisper-tiny/onnx
         W=https://huggingface.co/Xenova/whisper-tiny/resolve/main
         for f in config.json generation_config.json preprocessor_config.json tokenizer.json tokenizer_config.json; do curl -fL -o Xenova/whisper-tiny/$f $W/$f; done
         curl -fL -o Xenova/whisper-tiny/onnx/encoder_model_quantized.onnx $W/onnx/encoder_model_quantized.onnx
         curl -fL -o Xenova/whisper-tiny/onnx/decoder_model_merged_quantized.onnx $W/onnx/decoder_model_merged_quantized.onnx
         mkdir -p Xenova/opus-mt-en-fr/onnx
         T=https://huggingface.co/Xenova/opus-mt-en-fr/resolve/main
         for f in config.json generation_config.json tokenizer.json tokenizer_config.json special_tokens_map.json vocab.json source.spm target.spm; do curl -fL -o Xenova/opus-mt-en-fr/$f $T/$f || true; done
         curl -fL -o Xenova/opus-mt-en-fr/onnx/encoder_model_quantized.onnx $T/onnx/encoder_model_quantized.onnx
         curl -fL -o Xenova/opus-mt-en-fr/onnx/decoder_model_merged_quantized.onnx $T/onnx/decoder_model_merged_quantized.onnx
         git config user.name "bot"
         git config user.email "bot@example.com"
         git add -A
         git diff --cached --quiet || git commit -m "add whisper + translator"
         git push
